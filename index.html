<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sushma's Calculator</title>
<style>
body{background:#6a5acd; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; font-family:Arial;}
.box{background:white; padding:20px; border-radius:20px; width:300px; box-shadow:0 10px 30px rgba(0,0,0,0.3);}
h2{text-align:center; color:#6a5acd; margin:0 0 10px;}
#display{width:100%; height:60px; font-size:28px; text-align:right; border:2px solid #ddd; border-radius:10px; margin-bottom:15px; padding:5px 10px; box-sizing:border-box;}
.buttons{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
button{height:55px; font-size:20px; border:none; border-radius:10px; background:#f0f0f0; cursor:pointer;}
button:hover{background:#ddd;}
.op{background:#ffb84d;}
.eq{background:#6a5acd; color:white;}
.clear{background:#ff6b6b; color:white;}
</style>
</head>
<body>
<div class="box">
<h2>Sushma's Calculator</h2>
<input id="display" readonly>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="addValue('/')">/</button>
<button onclick="addValue('*')">x</button>
<button onclick="backspace()">⌫</button>
<button onclick="addValue('7')">7</button>
<button onclick="addValue('8')">8</button>
<button onclick="addValue('9')">9</button>
<button class="op" onclick="addValue('-')">-</button>
<button onclick="addValue('4')">4</button>
<button onclick="addValue('5')">5</button>
<button onclick="addValue('6')">6</button>
<button class="op" onclick="addValue('+')">+</button>
<button onclick="addValue('1')">1</button>
<button onclick="addValue('2')">2</button>
<button onclick="addValue('3')">3</button>
<button class="eq" onclick="calculate()">=</button>
<button onclick="addValue('0')">0</button>
<button onclick="addValue('00')">00</button>
<button onclick="addValue('.')">.</button>
<button onclick="addValue('%')">%</button>
</div>
</div>
<script>
function addValue(v){document.getElementById('display').value += v;}
function clearDisplay(){document.getElementById('display').value='';}
function backspace(){let d=document.getElementById('display'); d.value=d.value.slice(0,-1);}
function calculate(){let d=document.getElementById('display'); try{d.value=eval(d.value);}catch(e){d.value='Error';}}
</script>
</body>
</html>
